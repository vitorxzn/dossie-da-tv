<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dossiê da TV Brasileira</title>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--room:#2b3a35;--room2:#1c2724;--wood1:#7a4a29;--wood2:#4b2a15;--cream:#eadfc2;--brass:#c9a24b;--screen:#1d201c;--ink:#e2e6da;--dim:#9aa092;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--room:#1a2421;--room2:#0f1513}}
:root[data-theme="dark"]{--room:#1a2421;--room2:#0f1513}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,var(--room),var(--room2));font-family:"Libre Baskerville",Georgia,serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 14px 48px}
.tv{width:100%;max-width:1060px}
.cabinet{display:grid;grid-template-columns:1fr 210px;gap:18px;padding:26px;border-radius:34px;background:repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),linear-gradient(160deg,var(--wood1),var(--wood2));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -6px 14px rgba(0,0,0,.45),0 30px 50px rgba(0,0,0,.55)}
.bezel{padding:20px;border-radius:44px;background:linear-gradient(145deg,#2a1a0f,#120a05);box-shadow:inset 0 0 0 3px var(--brass),inset 0 6px 18px #000}
.screen{position:relative;height:min(76vh,640px);min-height:460px;overflow:hidden;border-radius:7% / 8%;background:var(--screen);box-shadow:inset 0 0 70px rgba(0,0,0,.9),0 0 0 2px #000}
.content{position:absolute;inset:0;background-size:cover;background-position:center;padding:7% 8% 8%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent;outline:none;text-shadow:0 0 6px rgba(226,230,218,.3)}
.tag{display:inline-block;font-family:Bevan,Georgia,serif;font-size:.8rem;border:2px solid var(--ink);padding:2px 10px;border-radius:4px;margin-bottom:12px}
h1{font-family:Bevan,Georgia,serif;font-weight:400;font-size:clamp(1.7rem,4vw,2.8rem);line-height:1.05;margin:0 0 4px}
h2{font-family:Bevan,Georgia,serif;font-weight:400;font-size:1.15rem;margin:26px 0 8px;border-bottom:2px dotted var(--dim);padding-bottom:4px}
.sub{color:var(--dim);font-style:italic;margin:0 0 16px}
.content p{line-height:1.75;font-size:.95rem;max-width:64ch;margin:0 0 12px}
ul{padding-left:20px;margin:0 0 12px;line-height:1.7;font-size:.93rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 6px;font-size:.9rem}
dt{color:var(--dim);font-style:italic}dd{margin:0}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--dim);font-size:.8rem;font-style:italic;border:2px dashed var(--dim);border-radius:6px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 8px,transparent 8px 16px)}
.hero{height:210px;margin:6px 0 18px}
img.hero{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:6px;border:2px solid var(--dim);filter:contrast(1.05)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gal .ph{aspect-ratio:4/3}
.gal figure{margin:0}.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:2px solid var(--dim)}
.vid{aspect-ratio:16/9;max-width:520px}
.play{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;text-decoration:none;color:var(--ink);font-family:Bevan,Georgia,serif;background:radial-gradient(ellipse at center,#2b2e29,#000);border:3px solid var(--ink);border-radius:14px}
.play:hover,.play:focus-visible{border-color:var(--brass);outline:none}
.tri{width:0;height:0;border-left:34px solid var(--ink);border-top:22px solid transparent;border-bottom:22px solid transparent}
a{color:var(--cream)}
.m3d{height:300px;border:2px dashed var(--dim);border-radius:6px;touch-action:pan-y;cursor:grab;background:radial-gradient(ellipse,#2b2e29,#111)}
.end{color:var(--dim);font-style:italic;font-size:.85rem;margin-top:26px}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 35% 25%,rgba(255,255,255,.09),transparent 45%)}
.noise{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:2;border-radius:inherit;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
.noise.on{opacity:1;animation:snow .4s steps(4) both}
@keyframes snow{0%{background-position:0 0}25%{background-position:-80px 40px}50%{background-position:60px -90px}75%{background-position:-30px 70px}100%{background-position:90px 20px}}
.off .content{opacity:0}.off .screen{background:#050605}
.off .screen::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 14px 6px rgba(255,255,255,.7);animation:dot 1.6s forwards}
@keyframes dot{from{transform:scale(40,.15)}30%{transform:scale(1)}to{transform:scale(0);opacity:0}}
.panel{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 12px;border-radius:22px;background:linear-gradient(#2a1a0f,#150c06);box-shadow:inset 0 0 0 2px var(--brass),inset 0 4px 12px #000}
.brand{font-family:Bevan,Georgia,serif;color:var(--brass);font-size:1.1rem;text-align:center;line-height:1.15}
.knob{width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 30%,#fff7df,var(--cream) 45%,#a99a73);box-shadow:0 5px 0 #6c5d3a,0 10px 16px rgba(0,0,0,.6);transition:transform .35s}
.knob::after{content:"";position:absolute;left:50%;top:7px;width:6px;height:26px;margin-left:-3px;border-radius:3px;background:#3a2a14}
.knob:focus-visible,.ch:focus-visible,.power:focus-visible{outline:3px solid #fff;outline-offset:3px}
#channels{display:flex;flex-direction:column;gap:8px;width:100%}
.ch{font:inherit;font-size:.8rem;text-align:left;padding:8px 10px;border-radius:8px;border:2px solid #5a4524;background:#24170c;color:var(--cream);cursor:pointer;line-height:1.25}
.ch b{font-family:Bevan,Georgia,serif;font-weight:400;color:var(--brass);margin-right:6px}
.ch small{display:block;opacity:.7;font-size:.7rem}
.ch[aria-current="true"]{background:var(--cream);color:#2a1a0f;border-color:var(--brass)}
.ch[aria-current="true"] b{color:#7a4a29}
.grille{width:100%;height:46px;border-radius:10px;background:repeating-linear-gradient(90deg,#0b0603 0 4px,#4a3318 4px 8px);box-shadow:inset 0 0 8px #000}
.power{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;cursor:pointer;color:var(--cream);font:inherit;font-size:.7rem}
.power .cap{position:relative;width:58px;height:58px;border-radius:50%;border:3px solid #2a1a0f;background:radial-gradient(circle at 35% 30%,#f4f1e6,#bdb8a6 55%,#8d8878);box-shadow:0 6px 0 #5d584a,0 10px 14px rgba(0,0,0,.6),inset 0 2px 3px #fff;transition:transform .12s,box-shadow .12s}
.power .cap::before{content:"";position:absolute;left:50%;top:11px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:#3a2a14}
.power .cap::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-10px 0 0 -12px;border-radius:50%;border:3px solid #3a2a14;border-top-color:transparent}
.power:active .cap,.power[aria-pressed="false"] .cap{transform:translateY(5px);box-shadow:0 1px 0 #5d584a,0 3px 6px rgba(0,0,0,.6),inset 0 2px 4px rgba(0,0,0,.25)}
.power .led{width:10px;height:10px;border-radius:50%;background:#ff4a2e;box-shadow:0 0 8px 2px #ff4a2e;transition:background .2s,box-shadow .2s}
.power[aria-pressed="false"] .led{background:#4a1a12;box-shadow:none}
.power:focus-visible .cap{outline:3px solid #fff;outline-offset:3px}
.legs{display:flex;justify-content:space-between;padding:0 12%}
.legs i{width:22px;height:36px;background:linear-gradient(90deg,#2a1a0f,#6b4023,#2a1a0f);transform:skewX(8deg)}
.legs i:last-child{transform:skewX(-8deg)}
@media(max-width:760px){.cabinet{grid-template-columns:1fr;padding:14px;border-radius:24px}.bezel{padding:12px;border-radius:32px}.panel{flex-direction:row;flex-wrap:wrap;justify-content:center}.brand{width:100%}#channels{width:auto;flex:1 1 200px}.grille{display:none}.power{margin:0}.hero{height:160px}.gal{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.noise.on,.knob,.off .screen::before{animation:none;transition:none}}
.tvimg,.hk{display:none}
@media(min-width:861px){
.tv{max-width:none}
.cabinet{display:block;position:relative;width:min(100%,1320px,calc(120vh*1.0975));aspect-ratio:1092/995;margin:0 auto 20px;padding:0;background:none;box-shadow:none;border-radius:0;container-type:inline-size}
.tvimg{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.bezel{position:static;padding:0;background:none;box-shadow:none;border-radius:0}

.hk{display:block;position:absolute;z-index:2;border:0;border-radius:50%;background:transparent;cursor:pointer}
.hk:focus-visible{outline:3px solid #fff}
#kp{transition:transform .1s}#kp:active{transform:scale(.9)}
#kp::after{content:"";position:absolute;inset:30%;border-radius:50%;background:#ffb347;opacity:.9;box-shadow:0 0 12px 4px rgba(255,179,71,.85);transition:opacity .25s,box-shadow .25s}
#kp[aria-pressed="false"]::after{opacity:0;box-shadow:none}

}
.roll{position:absolute;left:0;right:0;top:0;height:22%;z-index:1;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.07),transparent);animation:roll 9s linear infinite}
@keyframes roll{from{transform:translateY(-120%)}to{transform:translateY(520%)}}
.content{animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:1}7%{opacity:.95}8%{opacity:1}41%{opacity:.97}43%{opacity:.91}44%{opacity:1}72%{opacity:.96}73%{opacity:1}}
.content.glitch{animation:glitch .3s steps(6) 1;text-shadow:-2px 0 rgba(255,60,60,.7),2px 0 rgba(60,255,255,.7)}
@keyframes glitch{0%{transform:none}15%{transform:translateX(-7px) skewX(-4deg)}30%{transform:translateX(6px)}45%{transform:translateX(-4px) skewX(3deg)}60%{transform:translateX(5px)}80%{transform:translateX(-2px)}100%{transform:none}}
.noise.lite{opacity:.22;animation:snow .3s steps(4)}
.off .content,.off .roll{animation:none}
.off .roll{display:none}
@media(prefers-reduced-motion:reduce){.content,.content.glitch{animation:none}.roll{display:none}}

chapters:[
["Um país sem televisão",["No fim dos anos 1940, a televisão ainda era uma promessa distante para quase todos os brasileiros. Nos Estados Unidos ela já ocupava as salas de estar, mas no Brasil o rádio reinava sozinho, com seus programas de auditório, seus radioteatros e suas vozes que todo mundo reconhecia. Quem tinha dinheiro e visão para apostar numa tecnologia nova e cara era uma figura bem específica: Assis Chateaubriand.","Chateaubriand era dono dos Diários Associados, o maior conglomerado de comunicação do país, com jornais, revistas e rádios espalhados por vários estados. Era um homem de personalidade enorme, político, jornalista e empresário, conhecido por sua capacidade de articular apoios e por transformar ideias ousadas em projetos concretos. Para ele, a televisão seria o passo seguinte natural do seu império de comunicação.","O desafio era imenso. Era preciso importar equipamentos, montar estúdios, formar técnicos e, principalmente, convencer um público que nem sabia o que era aquilo a querer comprar um aparelho. Segundo relatos da época, técnicos estrangeiros chegaram a duvidar de que o projeto funcionaria no Brasil."]],
["18 de setembro de 1950: a estreia",["A TV Tupi-Difusora entrou no ar em 18 de setembro de 1950, em São Paulo, a partir de estúdios no bairro do Sumaré. Foi a primeira emissora de televisão do Brasil e da América Latina. A estreia não foi perfeita: o improviso marcou o dia, e a emissora nem tinha uma programação definida para o dia seguinte.","Como quase ninguém tinha televisor em casa, Chateaubriand mandou instalar aparelhos em pontos do centro de São Paulo, para que o público pudesse ver aquela novidade ao vivo, de pé, na rua. A imagem em preto e branco, instável e pequena, causava espanto em quem passava.","O programa de estreia foi comandado por Lolita Rodrigues e Airton Rodrigues. Lolita ocupou o lugar de Hebe Camargo, que era a escolhida inicialmente. Hebe, Lolita e outros nomes da futura elite artística brasileira começaram ou se consolidaram na Tupi, assim como Silvio Santos e tantos outros que passariam pela casa nas décadas seguintes."]],
["A televisão se inventa ao vivo",["Nos primeiros anos, não existia nenhum manual. Tudo era feito ao vivo, sem possibilidade de corrigir um erro: se um ator esquecia a fala, se uma câmera falhava, se o cenário caía, o público via. Esse improviso criou uma geração de profissionais que aprendeu a fazer televisão fazendo televisão.","Muita coisa vinha do rádio. Locutores, atores, diretores e músicos migraram para a TV levando consigo o jeito de contar histórias. Aos poucos, porém, a tela foi pedindo uma linguagem própria, com enquadramentos, ritmo e cenários pensados para a imagem.","Em 1951 a Tupi expandiu para o Rio de Janeiro, inaugurando sua emissora carioca. Foi o primeiro passo para se tornar uma rede, e o início de uma estrutura que, nos anos seguintes, chegaria a outras capitais por meio das emissoras dos Diários Associados."]],
["A primeira telenovela e os programas que fizeram história",["Em 1951 foi ao ar Sua Vida Me Pertence, considerada a primeira telenovela brasileira. Exibida duas vezes por semana, era bem diferente do que viria a ser a novela diária, mas abriu caminho para um gênero que se tornaria o maior produto cultural da televisão do país.","O jornalismo também nasceu ali. O Repórter Esso, que já fazia sucesso no rádio, passou para a televisão e virou referência de credibilidade, com formato enxuto e linguagem direta. Em outra frente, o teleteatro levou ao público peças adaptadas e produções ambiciosas, como as do TV de Vanguarda, que tratavam a TV como espaço de arte.","Havia ainda o humor, os programas de auditório, os musicais e os infantis. A Tupi formou uma programação variada, em que um mesmo canal tinha espaço para o popular e para o experimental. Isso explica por que tanta gente se lembra dela com carinho: ela foi, durante décadas, a única janela e depois a janela mais querida de muita gente."]],
["O auge: anos 1950 e 1960",["No auge, a Tupi era sinônimo de televisão. Com a expansão das emissoras associadas, a rede chegou a várias regiões do país e formou hábitos de consumo e de entretenimento. As famílias passaram a se reunir em volta do aparelho, e os vizinhos que não tinham televisor iam assistir na casa de quem tinha.","Nos anos 1960 entraram no ar produções que ficaram na memória, como o seriado O Vigilante Rodoviário, uma aventura policial feita no Brasil que conquistou crianças e adultos. Em 1968, a novela Beto Rockfeller, com Luís Gustavo, rompeu com o tom melodramático tradicional e apostou em um personagem cotidiano, malandro e urbano, com linguagem mais próxima da fala real. É lembrada como um divisor de águas.","Artistas como Roberto Carlos apareceram em programas da emissora, e a casa se tornou uma vitrine para a música popular, o humor e o teatro. A Tupi não era só entretenimento: era um espaço onde o país se via e se reconhecia."]],
["O homem por trás da emissora",["Chateaubriand tinha uma forma própria de tocar seus negócios: movido por intuição, relações políticas e muita ousadia, mas pouco apegado à organização administrativa. Isso ajudou a criar o império, mas também deixou fragilidades.","Em 1960 ele sofreu uma trombose que o deixou paralisado e quase sem fala. Mesmo doente, continuou à frente dos Diários Associados por anos, mas sem a energia de antes. Morreu em abril de 1968. A partir daí, o grupo ficou sem uma liderança forte, e as decisões passaram a ser disputadas entre herdeiros e administradores."]],
["A concorrência e a crise",["Nos anos 1970, o cenário mudou. A Rede Globo crescia com uma estratégia diferente: grade organizada, produção padronizada, uso da tecnologia de transmissão por satélite e microondas para formar uma rede nacional. A Tupi, ao contrário, ainda dependia de um modelo mais artesanal e de uma estrutura administrativa desgastada.","Os problemas financeiros se acumularam: dívidas, atrasos de salários, equipamentos envelhecidos e queda de audiência. Mesmo assim, em meio à crise, a emissora ainda conseguia produzir programas de qualidade, com equipes dedicadas que seguiam acreditando na casa.","Greves e paralisações passaram a fazer parte da rotina. O que foi uma emissora pioneira se transformou em uma empresa endividada, tentando sobreviver num mercado que já não esperava por ela."]],
["1980: a última transmissão",["O fim veio em julho de 1980. O governo federal, então sob o general Figueiredo, revogou as concessões das principais emissoras do grupo, alegando problemas financeiros e dívidas acumuladas. Há historiadores que apontam que não ficaram claros os motivos do ato e que a crise interna da Tupi era a principal explicação.","Em 17 de julho, os funcionários fizeram uma vigília de cerca de 18 horas ao vivo nos estúdios, com artistas, técnicos e público tentando evitar o fim da emissora. Foi um dos momentos mais emocionantes da história da televisão brasileira. No dia 18 de julho de 1980, a Tupi saiu do ar. No Rio de Janeiro, a emissora exibiu uma mensagem de despedida: “Até breve, telespectadores amigos”.","As frequências foram redistribuídas. Parte delas foi para o grupo de Silvio Santos, que lançaria o SBT, e parte para a Bloch Editores, que criaria a Rede Manchete. Silvio levou da Tupi o seu programa de auditório, que está no ar até hoje, e o jornalístico Aqui Agora, sucesso do SBT nos anos 1990, teve ali suas raízes."]],
["O legado",["Em poucos anos, a Tupi criou boa parte do vocabulário da televisão brasileira: o telejornal, a novela, o teleteatro, o programa de auditório, o seriado nacional. Muito do que a TV faz hoje nasceu ali, em estúdios improvisados e transmissões ao vivo.","Parte do acervo foi preservada, mas muita coisa se perdeu, como acontece com quase toda a TV daquela época, gravada em fitas caras que eram reaproveitadas ou se deterioravam. Hoje, pesquisadores, ex-funcionários e fãs mantêm viva a memória da emissora em livros, grupos de internet e acervos.","Mais de quatro décadas depois, ainda se fala da Tupi com saudade. Em 2024 circularam notícias de um projeto para relançar a marca, inicialmente pela internet, mas esse ponto ainda precisa ser confirmado. O que está confirmado é que, sem depender de nenhuma concessão, a Tupi continua existindo na memória do país."]]

 facts:[["Fundação","18 de setembro de 1950"],["Fundador","Assis Chateaubriand (Diários Associados)"],["Sede","São Paulo, com emissora no Rio desde 1951"],["Fim","18 de julho de 1980"]],
 s1:"A TV Tupi foi a primeira emissora de televisão do Brasil e da América Latina. Chateaubriand, o dono dos Diários Associados, importou os equipamentos e fez a estreia em São Paulo, em 1950, em um país onde quase ninguém ainda tinha aparelho em casa. Nas primeiras transmissões, os poucos televisores ficavam em vitrines e lugares públicos, e a gente se juntava na calçada para ver.",
 s2:"Nos anos 1950 e 1960 a Tupi virou uma rede com emissoras pelo país e dominou a audiência. Foi laboratório de tudo o que a TV brasileira faria depois: teleteatro, jornalismo, humor, programas de auditório e a telenovela. Em 1951 foi ao ar a novela Sua Vida Me Pertence, a primeira do Brasil.",
 hl:["Repórter Esso, o telejornal de maior prestígio da época","TV de Vanguarda, com teleteatro ao vivo","O Vigilante Rodoviário, seriado de sucesso nos anos 1960","Beto Rockfeller, novela que mudou a linguagem do gênero"],
 s3:"Com a morte de Chateaubriand em 1968 e a doença que o afastara antes, a rede ficou sem comando firme. Vieram dívidas, greves e atrasos de salário, e a concorrência da Globo crescia. Em 1980 o governo cassou as concessões da Tupi e a emissora saiu do ar. Parte dos canais foi redistribuída e deu origem a novas redes, como o SBT."},

 facts:[["Fundação","27 de setembro de 1953"],["Fundador","Paulo Machado de Carvalho (Rádio Record)"],["Sede","São Paulo"],["Fim da fase original","1989, com a venda para Edir Macedo"]],
 s1:"A TV Record nasceu da tradicional Rádio Record, que já era uma das maiores do país. Paulo Machado de Carvalho levou para a televisão a estrutura e os artistas do rádio e inaugurou a emissora em 1953, em São Paulo, três anos depois da Tupi.",
 s2:"Nos anos 1960 a Record se tornou a casa da música popular brasileira na TV. Seus festivais e programas musicais revelaram nomes que marcaram a cultura do país e atraíam multidões ao teatro e diante dos aparelhos de casa.",
 hl:["Festivais de Música Popular Brasileira, que lançaram canções históricas","O Fino da Bossa, com Elis Regina e Jair Rodrigues","Jovem Guarda, com Roberto Carlos, Erasmo e Wanderléa","Programas de auditório e humor que dominaram as noites"],

 facts:[["Fundação","9 de julho de 1960"],["Fundador","Grupo Simonsen (Mário Wallace Simonsen)"],["Sede","São Paulo, com emissora no Rio"],["Fim","30 de setembro de 1970"]],
 s1:"A Excelsior nasceu pertencendo a um grupo empresarial paulista, e já chegou com a ideia de que televisão era negócio e indústria. Entrou no ar em 1960, num mercado dominado pela Tupi, apostando em organização e em um jeito próprio de se apresentar ao público.",
 s2:"Foi a emissora que mais cedo organizou uma grade de programação com horários fixos e uma identidade visual marcante, com o símbolo da estrela. Em 1963 exibiu 2-5499 Ocupado, a primeira novela diária do Brasil, e investiu pesado em programas musicais e de humor.",
 hl:["2-5499 Ocupado, a primeira novela diária brasileira","Grade com horários fixos e programação planejada","Programas musicais com grandes nomes da época"],
 s3:"A trajetória da Excelsior foi curta. O grupo dono da emissora entrou em crise financeira depois do golpe de 1964, em meio a perseguição política e pressão do regime militar. A situação piorou até que, em 1970, a emissora perdeu as concessões e saiu do ar."},
{name:"TV Globo",years:"1965 até hoje",city:"Rio de Janeiro",endTitle:"E hoje?",
 facts:[["Fundação","26 de abril de 1965"],["Fundador","Roberto Marinho (Organizações Globo)"],["Sede","Rio de Janeiro"],["Situação","Segue no ar"]],
 s1:"A TV Globo foi inaugurada no Rio de Janeiro em 1965, pelo jornalista Roberto Marinho, dono do jornal O Globo. Nos primeiros anos recebeu apoio financeiro e técnico do grupo americano Time-Life, um acordo que gerou polêmica e foi investigado, e que acabou encerrado em 1971.",
 s2:"Entre o fim dos anos 1960 e os anos 1970 a Globo montou o modelo que a levaria à liderança: programação em rede nacional, grade organizada por horários e produção com acabamento técnico rigoroso, o chamado Padrão Globo de Qualidade. As novelas viraram o centro da noite brasileira e foram exportadas para o mundo.",
 hl:["Jornal Nacional, no ar desde 1969","Fantástico e Globo Repórter, estreados em 1973","Novelas em horários fixos, que passaram a marcar a rotina do país","Transmissão em rede para todo o território nacional"],
 s3:"Diferente das outras emissoras deste dossiê, a Globo não saiu do ar: ela se tornou a maior rede de televisão do Brasil e uma das maiores do mundo. Ao longo das décadas, a audiência foi se dividindo com outras emissoras, a TV paga e a internet, e a empresa vem se adaptando a esse cenário."},
{name:"TV Manchete",years:"1983 a 1999",city:"Rio de Janeiro",
 facts:[["Fundação","5 de junho de 1983"],["Fundador","Adolpho Bloch (Bloch Editores)"],["Sede","Rio de Janeiro"],["Fim","1999, com a venda e a criação da RedeTV!"]],
 s1:"A Manchete veio da editora Bloch, dona da revista que dava nome à emissora. Foi montada com parte dos canais que haviam sido da Tupi e entrou no ar em 1983, com um visual de TV de qualidade, imagens bem cuidadas e produções de grande orçamento.",
 s2:"No auge, a Manchete ganhou fama pela estética e pelas coberturas especiais, em especial o Carnaval, e pelas novelas e seriados de produção refinada. Também marcou a infância de muita gente com programas infantis e animes que viraram febre nos anos 1990.",
 hl:["Dona Beija e Pantanal, novelas de forte apelo visual","Cobertura do Carnaval carioca","Clube da Criança, com Angélica","Os Cavaleiros do Zodíaco e outros animes"],
 s3:"A emissora cresceu endividada. Os custos altos de produção, a perda de audiência e a morte de Adolpho Bloch em 1995 enfraqueceram o grupo. A situação financeira ficou insustentável, e em 1999 a rede foi vendida e deu lugar a um novo projeto, a RedeTV!."}
];
const $=id=>document.getElementById(id);
const content=$('content'),noise=$('noise'),knob=$('knob'),nav=$('channels'),tv=$('tv');
let cur=0,steps=0;
tvs.forEach((t,i)=>{const b=document.createElement('button');b.className='ch';b.innerHTML='<b>'+(i+1)+'</b>'+t.name+'<small>'+t.years+'</small>';b.onclick=()=>tune(i);nav.appendChild(b)});
function show(i){
  const t=tvs[i];
  content.style.backgroundImage=t.bg?'linear-gradient(rgba(29,32,28,.8),rgba(29,32,28,.9)),url('+t.bg+')':'';
  if(t.chapters){
    const w=t.chapters.reduce((a,c)=>a+c[1].join(' ').split(/\s+/).length,0);
    content.innerHTML='<span class="tag">CANAL '+(i+1)+'</span><h1>'+t.name+'</h1><p class="sub">'+t.years+', '+t.city+'. Leitura de cerca de '+Math.round(w/200)+' minutos</p>'+
     ''+(t.photo?'<img class="hero" src="'+t.photo+'" alt="'+t.alt+'">':'<div class="ph hero">Foto do aparelho de TV da época</div>')+'<dl>'+t.facts.map(f=>'<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>').join('')+'</dl>'+
     t.chapters.map(c=>'<h2>'+c[0]+'</h2>'+c[1].map(p=>'<p>'+p+'</p>').join('')).join('')+
     (t.links?'<h2>Para ler mais</h2><ul>'+t.links.map(l=>'<li><a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a></li>').join('')+'</ul>':'')+
     '<h2>Galeria</h2><div class="gal">'+(t.gal?t.gal.map(g=>'<figure><img src="'+g[0]+'" alt="'+g[1]+'"></figure>').join(''):'<div class="ph">Foto 1</div><div class="ph">Foto 2</div><div class="ph">Foto 3</div>')+'</div>'+
     '<h2>Vídeo</h2>'+(t.video?'<a class="vid play" href="'+t.video+'" target="_blank" rel="noopener"><span class="tri"></span>Assistir ao vídeo sobre a '+t.name+' no YouTube</a>':'<div class="ph vid">Vídeo sobre a '+t.name+'</div>')+''+(t.video?'<h2>O fim da transmissão</h2>'+(t.endvid?'<a class="vid play" href="'+t.endvid+'" target="_blank" rel="noopener"><span class="tri"></span>Assistir à despedida da '+t.name+' no YouTube</a>':'<div class="ph vid">Vídeo da despedida da emissora, em 1980</div>'):'')+'<p class="end">Fim da transmissão deste canal.</p>';
    content.scrollTop=0;
    [...nav.children].forEach((b,j)=>b.setAttribute('aria-current',j===i));
    return;
  }
  content.innerHTML=
   '<span class="tag">CANAL '+(i+1)+'</span><h1>'+t.name+'</h1><p class="sub">'+t.years+', '+t.city+'</p>'+
   '<div class="ph hero">Foto do aparelho de TV da época</div>'+
   '<dl>'+t.facts.map(f=>'<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>').join('')+'</dl>'+
   '<h2>Como tudo começou</h2><p>'+t.s1+'</p>'+
   '<h2>O auge</h2><p>'+t.s2+'</p><ul>'+t.hl.map(h=>'<li>'+h+'</li>').join('')+'</ul>'+
   '<h2>'+(t.endTitle||'O fim')+'</h2><p>'+t.s3+'</p>'+
   '<h2>Galeria</h2><div class="gal"><div class="ph">Foto 1</div><div class="ph">Foto 2</div><div class="ph">Foto 3</div></div>'+
   '<h2>Vídeo</h2><div class="ph vid">Vídeo sobre a '+t.name+'</div>'+
   '<p class="end">Fim da transmissão deste canal.</p>';
  content.scrollTop=0;
  [...nav.children].forEach((b,j)=>b.setAttribute('aria-current',j===i));
}
function ping(){noise.classList.remove('on');void noise.offsetWidth;noise.classList.add('on')}
function tune(i){if(tv.classList.contains('off'))power();cur=i;steps++;knob.style.transform='rotate('+(steps*50)+'deg)';ping();setTimeout(()=>show(cur),180)}
function clk(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=170;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.06);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.07)}catch(e){}}
function power(){clk();const off=tv.classList.toggle('off');$('power').setAttribute('aria-pressed',!off);$('kp').setAttribute('aria-pressed',!off);if(!off){ping();show(cur)}}
knob.onclick=()=>tune((cur+1)%tvs.length);
const rk={kl:0,kr:0};function rot(id,d){rk[id]+=d;$(id).style.setProperty('--r',rk[id]+'deg')}
$('kr').onclick=()=>{rot('kr',45);tune((cur+1)%tvs.length)};$('kl').onclick=()=>{rot('kl',-45);tune((cur+tvs.length-1)%tvs.length)};$('kp').onclick=power;
$('power').onclick=power;
show(0);
(function(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
function g(){if(!tv.classList.contains('off')){content.classList.add('glitch');noise.classList.add('lite');setTimeout(()=>{content.classList.remove('glitch');noise.classList.remove('lite')},320)}setTimeout(g,4000+Math.random()*7000)}
setTimeout(g,2500)})();
</script>
